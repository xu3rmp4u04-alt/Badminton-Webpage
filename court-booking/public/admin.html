<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>球場預約管理後台</title>
  <style>
    * { box-sizing: border-box; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 30px 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 1200px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { color: #2c3e50; margin-top: 0; }
    .login-box { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    button { padding: 10px 18px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-primary { background-color: #007bff; color: white; width: 100%; }
    .btn-danger { background-color: #dc3545; color: white; padding: 6px 12px; font-size: 13px; }
    .btn-secondary { background-color: #6c757d; color: white; float: right; }
    .btn-sm { padding: 4px 8px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background-color: #f8f9fa; color: #333; }
    tr:hover { background-color: #f9f9f9; }
    .tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
    .tag-badminton { background-color: #28a745; }
    .tag-pickleball { background-color: #fd7e14; }
    .date-divider { background-color: #e9ecef; font-weight: bold; color: #495057; font-size: 15px; }
    .date-divider td { padding: 8px 12px; border-top: 2px solid #dee2e6; }
    .checkbox-paid { width: 18px; height: 18px; cursor: pointer; vertical-align: middle; }
    .paid-text { font-size: 13px; font-weight: bold; }
    .text-paid { color: #28a745; }
    .text-unpaid { color: #dc3545; }
    .price-tag { font-weight: bold; color: #d9534f; font-size: 15px; cursor: pointer; border-bottom: 1px dashed #d9534f; }
    .price-tag:hover { color: #c9302c; }
    .price-input { width: 80px; padding: 4px; font-size: 14px; }
    .created-time { font-size: 12px; color: #666; font-family: monospace; }
    #loginMsg { margin-top: 10px; color: red; text-align: center; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  </style>
</head>
<body>

<div id="loginSection" class="login-box" style="display: none;">
  <h2 style="text-align: center;">管理者登入</h2>
  <form id="loginForm">
    <div class="form-group">
      <label for="adminUser">帳號：</label>
      <input type="text" id="adminUser" placeholder="預設 admin" required>
    </div>
    <div class="form-group">
      <label for="adminPass">密碼：</label>
      <input type="password" id="adminPass" placeholder="預設 admin123" required>
    </div>
    <button type="submit" class="btn-primary">登入系統</button>
  </form>
  <div id="loginMsg"></div>
</div>

<div id="adminSection" class="container" style="display: none;">
  <div class="header-bar">
    <h2>預約管理後台 (僅顯示今日及未來)</h2>
    <div>
      <button class="btn-secondary" onclick="fetchBookings()" style="margin-right: 10px;">重新整理</button>
      <button class="btn-secondary" onclick="logout()">登出</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>訂場時間</th>
        <th>預約時段</th>
        <th>運動</th>
        <th>姓名</th>
        <th>電話</th>
        <th>應收金額 (點擊可修改)</th>
        <th>已收款</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="bookingTableBody">
      <tr>
        <td colspan="8" style="text-align: center; color: #888;">資料載入中...</td>
      </tr>
    </tbody>
  </table>
</div>

<script>
  checkAuth();

  // 每 3 秒檢查一次後端，若超過 10 分鐘無人預約，自動在後台畫面上跳出「測試」彈窗並防休眠
  setInterval(async () => {
    try {
      const res = await fetch('/api/admin/check-alert');
      const data = await res.json();
      if (data && data.showAlert) {
        alert('測試');
      }
    } catch (e) {}
  }, 3000);

  async function checkAuth() {
    try {
      const res = await fetch('/api/admin/check-auth');
      const data = await res.json();
      if (data.authenticated) {
        showAdminPanel();
      } else {
        showLoginForm();
      }
    } catch (err) {
      showLoginForm();
    }
  }

  function showLoginForm() {
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('adminSection').style.display = 'none';
  }

  function showAdminPanel() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminSection').style.display = 'block';
    fetchBookings();
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('adminUser').value;
    const password = document.getElementById('adminPass').value;
    const msgDiv = document.getElementById('loginMsg');
    msgDiv.innerText = '';

    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (res.ok && data.success) {
        showAdminPanel();
      } else {
        msgDiv.innerText = data.message || '登入失敗';
      }
    } catch (err) {
      msgDiv.innerText = '連線失敗';
    }
  });

  async function fetchBookings() {
    const tbody = document.getElementById('bookingTableBody');
    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #888;">讀取中...</td></tr>';

    try {
      const res = await fetch('/api/admin/bookings');
      if (res.status === 401) return showLoginForm();

      const data = await res.json();

      if (data.success && data.bookings.length > 0) {
        const mergedBookings = mergeConsecutiveBookings(data.bookings);
        
        let html = '';
        let lastDate = '';

        mergedBookings.forEach((group, index) => {
          if (group.booking_date !== lastDate) {
            lastDate = group.booking_date;
            const weekDay = getWeekDayName(lastDate);
            html += `
              <tr class="date-divider">
                <td colspan="8">📅 ${lastDate} (${weekDay})</td>
              </tr>
            `;
          }

          const isPaid = !!group.is_paid;
          const idsJson = JSON.stringify(group.ids);

          html += `
            <tr>
              <td><span class="created-time">${group.created_at || '無紀錄'}</span></td>
              <td><b>${group.time_range}</b></td>
              <td>
                <span class="tag ${group.sport_type === '羽球' ? 'tag-badminton' : 'tag-pickleball'}">
                  ${group.sport_type}
                </span>
              </td>
              <td>${group.user_name}</td>
              <td>${group.user_phone}</td>
              <td>
                <span id="price-display-${index}" class="price-tag" title="點擊修改金額" onclick="enableEditPrice(${index})">$${group.totalPrice}</span>
                <div id="price-edit-${index}" style="display:none; align-items: center; gap: 5px;">
                  <input type="number" id="price-input-${index}" class="price-input" value="${group.totalPrice}">
                  <button class="btn-primary btn-sm" onclick="savePrice(${idsJson}, ${index})">好</button>
                  <button class="btn-secondary btn-sm" onclick="cancelEditPrice(${index}, ${group.totalPrice})">✕</button>
                </div>
              </td>
              <td>
                <input type="checkbox" class="checkbox-paid" ${isPaid ? 'checked' : ''} 
                       onchange="togglePayment(${idsJson}, this.checked)">
                <span class="paid-text ${isPaid ? 'text-paid' : 'text-unpaid'}">
                  ${isPaid ? '已收' : '未收'}
                </span>
              </td>
              <td>
                <button class="btn-danger" onclick="deleteBooking(${idsJson})">取消預約</button>
              </td>
            </tr>
          `;
        });

        tbody.innerHTML = html;
      } else {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #888;">目前尚無今日或未來的預約紀錄</td></tr>';
      }
    } catch (err) {
      console.error('後台渲染錯誤:', err);
      tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: red;">資料解析發生錯誤</td></tr>';
    }
  }

  function parseSlotTime(timeSlotStr) {
    try {
      const parts = timeSlotStr.split('-');
      const startHour = parseInt(parts[0].replace(/[^0-9]/g, ''), 10);
      const endHour = parseInt(parts[1].replace(/[^0-9]/g, ''), 10);
      return { startHour, endHour };
    } catch (e) {
      return { startHour: 0, endHour: 0 };
    }
  }

  function mergeConsecutiveBookings(bookings) {
    const groups = [];

    bookings.forEach(b => {
      const { startHour, endHour } = parseSlotTime(b.time_slot);

      const prev = groups.find(g => 
        g.booking_date === b.booking_date &&
        g.sport_type === b.sport_type &&
        g.user_name === b.user_name &&
        g.user_phone === b.user_phone &&
        g.endHour === startHour
      );

      if (prev) {
        prev.endHour = endHour;
        prev.ids.push(b.id);
        prev.totalPrice += (b.price || 0); 
        if (!b.is_paid) prev.is_paid = 0; 
      } else {
        groups.push({
          booking_date: b.booking_date,
          sport_type: b.sport_type,
          user_name: b.user_name,
          user_phone: b.user_phone,
          startHour: startHour,
          endHour: endHour,
          totalPrice: b.price || 0,
          is_paid: b.is_paid || 0,
          created_at: b.created_at, 
          ids: [b.id]
        });
      }
    });

    groups.sort((a, b) => {
      if (a.booking_date !== b.booking_date) {
        return a.booking_date.localeCompare(b.booking_date);
      }
      const nameCompare = a.user_name.localeCompare(b.user_name, 'zh-Hant');
      if (nameCompare !== 0) {
        return nameCompare;
      }
      return a.startHour - b.startHour;
    });

    return groups.map(g => {
      const startStr = g.startHour < 10 ? `0${g.startHour}:00` : `${g.startHour}:00`;
      const endStr = g.endHour < 10 ? `0${g.endHour}:00` : `${g.endHour}:00`;
      return {
        ...g,
        time_range: `${startStr} - ${endStr}`
      };
    });
  }

  // 點擊金額開啟修改框
  function enableEditPrice(index) {
    document.getElementById(`price-display-${index}`).style.display = 'none';
    document.getElementById(`price-edit-${index}`).style.display = 'flex';
    document.getElementById(`price-input-${index}`).focus();
  }

  // 取消修改金額
  function cancelEditPrice(index, originalPrice) {
    document.getElementById(`price-input-${index}`).value = originalPrice;
    document.getElementById(`price-edit-${index}`).style.display = 'none';
    document.getElementById(`price-display-${index}`).style.display = 'inline';
  }

  // 儲存修改後的金額（自動平分到該筆合併訂單底下的所有時段 id 中）
  async function savePrice(ids, index) {
    const newTotal = parseFloat(document.getElementById(`price-input-${index}`).value);
    if (isNaN(newTotal) || newTotal < 0) {
      alert('請輸入有效的金額');
      return;
    }

    // 將金額平均分配給合併的各個小單（避免資料庫金額落差）
    const pricePerItem = Math.round(newTotal / ids.length);

    try {
      // 逐筆更新該組合下的價格
      for (let i = 0; i < ids.length; i++) {
        const p = (i === ids.length - 1) ? (newTotal - pricePerItem * (ids.length - 1)) : pricePerItem;
        await fetch('/api/admin/bookings/price', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: ids[i], price: p })
        });
      }
      fetchBookings();
    } catch (err) {
      alert('更新金額失敗');
    }
  }

  async function togglePayment(ids, isPaid) {
    try {
      await fetch('/api/admin/bookings/payment', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids, is_paid: isPaid })
      });
      fetchBookings();
    } catch (err) {
      alert('連線失敗');
    }
  }

  async function deleteBooking(ids) {
    if (!confirm('確定要取消這筆預約嗎？')) return;

    try {
      await fetch('/api/admin/bookings', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids })
      });
      fetchBookings();
    } catch (err) {
      alert('刪除時發生錯誤');
    }
  }

  function getWeekDayName(dateStr) {
    const days = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    return days[new Date(dateStr).getDay()];
  }

  async function logout() {
    await fetch('/api/admin/logout', { method: 'POST' });
    showLoginForm();
  }
</script>

</body>
</html>
